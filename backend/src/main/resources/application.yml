spring:
  application:
    name: quiz-backend
  config:
    import: optional:file:./config/application-local.properties
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${QUIZ_DB_URL:jdbc:mysql://127.0.0.1:3306/quiz_homework?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${QUIZ_DB_USER:quiz_app}
    password: ${QUIZ_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql
      data-locations: classpath:data-mysql.sql
      encoding: UTF-8
  jackson:
    time-zone: Asia/Shanghai
server:
  address: ${QUIZ_BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
mybatis:
  configuration:
    map-underscore-to-camel-case: true
quiz:
  cors-origins: ${QUIZ_CORS_ORIGINS:http://127.0.0.1:7000,http://localhost:7000}
